# Every morning: pull yesterday's games, refit all ratings, publish the site.
name: Daily update

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 3:17 am Mountain (4:17 am in summer)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      backfill:
        description: "Also download a past season first (e.g. 2026 for 2025-26). Leave blank for a normal run."
        required: false
        default: ""
      refetch:
        description: "Re-download every day of a season, e.g. 2027 (picks up newly saved details). Leave blank normally."
        required: false
        default: ""
      football_backfill:
        description: "Download past college football seasons, e.g. '2024 2025'. Leave blank normally."
        required: false
        default: ""
      history:
        description: "Also download past seasons' scores for the tournament model, e.g. '2012 2025'. Leave blank normally."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # the first run backfills the whole season so far
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Backfill a past season
        if: ${{ github.event.inputs.backfill != '' }}
        run: python -m basketball.run --backfill "${{ github.event.inputs.backfill }}"

      - name: Re-download a season
        if: ${{ github.event.inputs.refetch != '' }}
        run: |
          for s in ${{ github.event.inputs.refetch }}; do python -m basketball.run --backfill "$s" --force; done

      - name: Download past seasons' scores
        if: ${{ github.event.inputs.history != '' }}
        run: python -m basketball.history ${{ github.event.inputs.history }}

      - name: Basketball (Nov - Apr)
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 11 ] || [ "$month" -le 4 ]; then
            python -m basketball.bracketmatrix
            python -m basketball.run --fetch
          else
            echo "Basketball is out of season; keeping last ratings."
          fi

      - name: Football backfill
        continue-on-error: true   # a football problem shouldn't block basketball
        if: ${{ github.event.inputs.football_backfill != '' }}
        run: |
          for s in ${{ github.event.inputs.football_backfill }}; do python -m football.run --backfill "$s"; done

      - name: Football (Aug - Jan)
        continue-on-error: true   # a football problem shouldn't block basketball
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 8 ] || [ "$month" -le 1 ]; then
            python -m football.run --fetch
          else
            echo "Football is out of season; keeping last ratings."
          fi

      - name: Save new data
        run: |
          git config user.name  "sportsbynumbers-bot"
          git config user.email "sportsbynumbers-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          # Code may have been pushed while this ran; data and code never touch the same files
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
