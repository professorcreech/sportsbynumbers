# Every morning: pull yesterday's games, refit all ratings, publish the site.
name: Daily update

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 3:17 am Mountain (4:17 am in summer)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      backfill:
        description: "Also download a past season first (e.g. 2026 for 2025-26). Leave blank for a normal run."
        required: false
        default: ""
      refetch:
        description: "Re-download every day of a season, e.g. 2027 (picks up newly saved details). Leave blank normally."
        required: false
        default: ""
      probe:
        description: "Save the structure of sample ESPN responses (for building new sports). Leave blank normally."
        required: false
        default: ""
      pro_backfill:
        description: "Download past NBA/NFL seasons, e.g. 'nba:2026 nfl:2025'. Leave blank normally."
        required: false
        default: ""
      football_backfill:
        description: "Download past college football seasons, e.g. '2024 2025'. Leave blank normally."
        required: false
        default: ""
      history:
        description: "Also download past seasons' scores for the tournament model, e.g. '2012 2025'. Leave blank normally."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # the first run backfills the whole season so far
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Backfill a past season
        if: ${{ github.event.inputs.backfill != '' }}
        run: python -m basketball.run --backfill "${{ github.event.inputs.backfill }}"

      - name: Re-download a season
        if: ${{ github.event.inputs.refetch != '' }}
        run: |
          for s in ${{ github.event.inputs.refetch }}; do python -m basketball.run --backfill "$s" --force; done

      - name: Download past seasons' scores
        if: ${{ github.event.inputs.history != '' }}
        run: python -m basketball.history ${{ github.event.inputs.history }}

      - name: Basketball (Nov - Apr)
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 11 ] || [ "$month" -le 4 ]; then
            python -m basketball.bracketmatrix
            python -m basketball.run --fetch
            python -m basketball.bracket || echo "Tournament odds not updated"
          else
            echo "Basketball is out of season; keeping last ratings."
          fi

      - name: Probe sample responses
        if: ${{ github.event.inputs.probe != '' }}
        continue-on-error: true
        run: python -m tools.probe

      - name: Football backfill
        continue-on-error: true   # a football problem shouldn't block basketball
        if: ${{ github.event.inputs.football_backfill != '' }}
        run: |
          for s in ${{ github.event.inputs.football_backfill }}; do python -m football.run --backfill "$s"; done

      - name: Football (Aug - Jan)
        continue-on-error: true   # a football problem shouldn't block basketball
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 8 ] || [ "$month" -le 1 ]; then
            python -m football.run --fetch
          else
            echo "Football is out of season; keeping last ratings."
          fi

      - name: NBA / NFL backfill
        if: ${{ github.event.inputs.pro_backfill != '' }}
        continue-on-error: true
        run: |
          for item in ${{ github.event.inputs.pro_backfill }}; do
            league=${item%%:*}; season=${item##*:}
            if [ "$league" = nba ]; then SBN_LEAGUE=nba python -m basketball.run --backfill "$season"; fi
            if [ "$league" = nfl ]; then SBN_LEAGUE=nfl python -m football.run --backfill "$season"; fi
          done

      - name: NBA (Oct - Jun)
        continue-on-error: true   # a pro-league problem shouldn't block college
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 10 ] || [ "$month" -le 6 ]; then
            SBN_LEAGUE=nba python -m basketball.run --fetch
          else
            echo "NBA is out of season; keeping last ratings."
          fi

      - name: NFL (Sep - Feb)
        continue-on-error: true
        run: |
          month=$(date -u +%-m)
          if [ "$month" -ge 9 ] || [ "$month" -le 2 ]; then
            SBN_LEAGUE=nfl python -m football.run --fetch
          else
            echo "NFL is out of season; keeping last ratings."
          fi

      - name: Save new data
        run: |
          git config user.name  "sportsbynumbers-bot"
          git config user.email "sportsbynumbers-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          # Code or another run may have pushed meanwhile. Rebase onto it; where both changed the
          # same data file, keep this run's copy (it was downloaded last).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not save data to the repository"; exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
